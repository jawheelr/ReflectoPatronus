# ReflectoPatronus PostgreSQL settings: the SINGLE source for both Docker and LXC.
#  - Docker: docker-entrypoint-wrapper.sh turns every `key = value` line in /etc/reflectopatronus/conf.d/*.conf into `-c key=value`.
#  - LXC/Debian: provision-db.sh copies this file to /etc/postgresql/17/main/conf.d/ (PostgreSQL includes that directory natively).
# Same file, same absolute paths in both. Do not add anything that only one runtime understands.

hba_file = '/etc/reflectopatronus/pg_hba.conf'

ssl = on
ssl_min_protocol_version = 'TLSv1.3'
ssl_ca_file = '/etc/reflectopatronus/pki/ca.crt'
ssl_cert_file = '/etc/reflectopatronus/pki/server.crt'
ssl_key_file = '/etc/reflectopatronus/pki/server.key'

# Docker: the network boundary is the private compose network. LXC: provision-db.sh narrows this to the CT address
# (LISTEN_ADDRESSES) and you should still firewall 5432 to the API container only.
listen_addresses = '*'
