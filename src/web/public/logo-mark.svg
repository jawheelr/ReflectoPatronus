<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="ReflectoPatronus">
  <defs>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc3ee"/><stop offset="1" stop-color="#1d4a9e"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflect" maskUnits="userSpaceOnUse" x="0" y="58" width="96" height="38"><rect x="0" y="60" width="96" height="30" fill="url(#fade)"/></mask>
    <clipPath id="shape"><rect x="4" y="4" width="88" height="88" rx="14"/></clipPath>
    <path id="r" d="M34 52V19H50a10.5 10.5 0 0 1 0 21H34M48 40L60 52" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
