<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 96" role="img" aria-label="ReflectoPatronus">
  <g>
  <defs>
    <linearGradient id="lk-pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc3ee"/><stop offset="1" stop-color="#1d4a9e"/>
    </linearGradient>
    <linearGradient id="lk-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="lk-reflect" maskUnits="userSpaceOnUse" x="0" y="58" width="96" height="38"><rect x="0" y="60" width="96" height="30" fill="url(#lk-fade)"/></mask>
    <clipPath id="lk-shape"><rect x="4" y="4" width="88" height="88" rx="14"/></clipPath>
    <path id="lk-r" d="M34 52V19H50a10.5 10.5 0 0 1 0 21H34M48 40L60 52" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <g clip-path="url(#lk-shape)">
    <rect x="4" y="4" width="88" height="88" fill="url(#lk-pane)"/>
    <polygon points="4,58 58,4 76,4 4,76" fill="#fff" opacity=".20"/>
    <polygon points="4,86 86,4 92,4 92,10 10,92 4,92" fill="#fff" opacity=".12"/>
    <use href="#lk-r"/>
    <line x1="16" y1="60" x2="80" y2="60" stroke="#fff" stroke-opacity=".6" stroke-width="1.6" stroke-linecap="round"/>
    <g mask="url(#lk-reflect)"><use href="#lk-r" transform="translate(0,120) scale(1,-1)"/></g>
  </g>
  <rect x="4" y="4" width="88" height="88" rx="14" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
</g>
  <text x="112" y="60" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" fill="#1d4a9e"><tspan font-weight="300" fill="#4d6a9c">reflecto</tspan><tspan font-weight="700">patronus</tspan></text>
  <text x="114" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" letter-spacing="2.4" fill="#6b7686">GLASS · MIRRORS · SHOWER ENCLOSURES</text>
</svg>
