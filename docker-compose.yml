name: reflectopatronus

services:
  api:
    build:
      context: ./src/ReflectoPatronus.Api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      Security__RequirePqcVerification: ${REQUIRE_PQC_VERIFICATION:-false}
      Database__ConnectionString: "Host=db;Port=5432;Database=${POSTGRES_DB:-reflectopatronus};Username=${APP_DB_USER:-reflectopatronus_app};Password=${APP_DB_PASSWORD};SSL Mode=VerifyFull;Root Certificate=/run/db-certs/ca.crt;SSL Certificate=/run/db-certs/api-client.crt;SSL Key=/run/db-certs/api-client.key;Timeout=8;Command Timeout=15;"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Development only. In production, put the API behind the reverse proxy.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./certs/ca.crt:/run/db-certs/ca.crt:ro
      - ./certs/api-client.crt:/run/db-certs/api-client.crt:ro
      - ./certs/api-client.key:/run/db-certs/api-client.key:ro
    networks:
      - app
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/live"]
      interval: 20s
      timeout: 3s
      retries: 3

  db:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reflectopatronus}
      POSTGRES_USER: ${POSTGRES_USER:-reflectopatronus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-reflectopatronus_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./certs/ca.crt:/run/input-certs/ca.crt:ro
      - ./certs/postgres-server.crt:/run/input-certs/server.crt:ro
      - ./certs/postgres-server.key:/run/input-certs/server.key:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

networks:
  app:
  database:
    internal: true

volumes:
  postgres-data:
