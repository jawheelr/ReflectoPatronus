name: reflectopatronus

services:
  api:
    build:
      context: ./src/ReflectoPatronus.Api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}   # set by scripts/setup.sh and scripts/update.sh; lets the console tell when a newer commit exists
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      Security__RequirePqcVerification: ${REQUIRE_PQC_VERIFICATION:-false}
      # First run only: creates this user with this password if NO user has a password yet. Remove afterwards.
      Transfer__Directory: /data/transfer
      Updates__Directory: /data/update       # hand-off folder shared with the updater service
      Gateway__Mode: ${GATEWAY_MODE:-off}
      Gateway__SharedSecret: ${GATEWAY_SHARED_SECRET:-}
      Bootstrap__AdminUser: ${BOOTSTRAP_ADMIN_USER:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Database__ConnectionString: "Host=db;Port=5432;Database=${POSTGRES_DB:-reflectopatronus};Username=${APP_DB_USER:-reflectopatronus_app};Password=${APP_DB_PASSWORD};SSL Mode=VerifyFull;Root Certificate=/run/db-certs/ca.crt;SSL Certificate=/run/db-certs/api-client.crt;SSL Key=/run/db-certs/api-client.key;Timeout=8;Command Timeout=15;GSS Encryption Mode=Disable;"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Development only. In production, put the API behind the reverse proxy.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - transfer-data:/data/transfer
      - update-data:/data/update
      - ./certs/ca.crt:/run/db-certs/ca.crt:ro
      - ./certs/api-client.crt:/run/db-certs/api-client.crt:ro
      - ./certs/api-client.key:/run/db-certs/api-client.key:ro
    networks:
      - app
      - database
    restart: unless-stopped
    healthcheck:
      # The aspnet image has no curl/wget; bash is present. Checks /health/live only (liveness, not readiness).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 20s
      timeout: 3s
      retries: 3

  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reflectopatronus}
      POSTGRES_USER: ${POSTGRES_USER:-reflectopatronus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-reflectopatronus_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./certs/ca.crt:/run/input-certs/ca.crt:ro
      - ./certs/postgres-server.crt:/run/input-certs/server.crt:ro
      - ./certs/postgres-server.key:/run/input-certs/server.key:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Installs updates when an administrator clicks "Update now" in the console (and downloads them ahead of time).
  # It needs the Docker socket, i.e. full control of Docker on this machine, so it is a separate container with no open ports
  # and no network input: the only thing it reads is a request file the API writes. It never acts on its own.
  # To turn one-click updates off, remove this service (./scripts/update.sh in a terminal keeps working).
  # RP_PROJECT_DIR is this folder's absolute path; scripts/setup.sh and scripts/update.sh write it to .env.
  updater:
    build:
      context: ./docker/updater
    environment:
      RP_PROJECT_DIR: ${RP_PROJECT_DIR:-}
      RP_BRANCH: ${RP_BRANCH:-main}
      UPDATE_DIR: /data/update
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${RP_PROJECT_DIR:-.}
        target: ${RP_PROJECT_DIR:-/project}
      - update-data:/data/update
    networks:
      - app
    restart: unless-stopped

  # Remote access with mTLS + post-quantum key exchange (compose profile "gateway": COMPOSE_PROFILES=gateway in .env,
  # set up by scripts/setup.sh). Publish GATEWAY_PORT on your router; keep 80/443 for other services (e.g. Synology).
  gateway:
    image: caddy:2-alpine
    profiles: ["gateway"]
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-8443}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      API_UPSTREAM: api:8080
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8443}:${GATEWAY_PORT:-8443}"
    volumes:
      - ./deploy/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/gateway.crt:/certs/gateway.crt:ro
      - ./certs/gateway.key:/certs/gateway.key:ro
      - ./certs/client-ca.crt:/certs/client-ca.crt:ro
    networks:
      - app
    restart: unless-stopped

networks:
  app:
  database:
    internal: true

volumes:
  update-data:     # hand-off between the API and the updater: request.json, status.json (progress page)
  transfer-data:   # large database exports/imports run on the server and use this folder (Utilities > Import / Export Database)
  postgres-data:
